<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator Demo</title>
  <!-- React and ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for on‑the‑fly JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    // Import the component code directly (as plain JS, not a module system)
    const SimpleCalculator = () => {
      const [a, setA] = React.useState(0);
      const [b, setB] = React.useState(0);
      const [op, setOp] = React.useState("+");

      const calculate = () => {
        const x = parseFloat(a);
        const y = parseFloat(b);
        if (Number.isNaN(x) || Number.isNaN(y)) return "";
        switch (op) {
          case "+":
            return x + y;
          case "-":
            return x - y;
          case "*":
            return x * y;
          case "/":
            return y !== 0 ? x / y : "∞";
          default:
            return "";
        }
      };

      const result = calculate();

      return (
        <div style={{ maxWidth: "300px", margin: "1rem", fontFamily: "sans-serif" }}>
          <h3>Simple Calculator</h3>
          <div style={{ marginBottom: "0.5rem" }}>
            <input
              type="number"
              value={a}
              onChange={e => setA(e.target.value)}
              style={{ width: "80px", marginRight: "0.5rem" }}
            />
            <select value={op} onChange={e => setOp(e.target.value)}>
              <option value="+">+</option>
              <option value="-">-</option>
              <option value="*">×</option>
              <option value="/">÷</option>
            </select>
            <input
              type="number"
              value={b}
              onChange={e => setB(e.target.value)}
              style={{ width: "80px", marginLeft: "0.5rem" }}
            />
          </div>
          <div>
            <strong>Result: </strong>{result}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SimpleCalculator />);
  </script>
</body>
</html>
